services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mysummit-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: mysummit-web
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mysummit-db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: mysummit
      MYSQL_USER: mysummit_user
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  frontend:
    image: node:20
    container_name: mysummit-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"  # ← Fixed: npm start

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: mysummit-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: secret
    depends_on:
      - db
    ports:
      - "8081:80"

volumes:
  db_data: